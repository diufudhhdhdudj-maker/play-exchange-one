<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA://TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020617;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 10px;
        }
        .title-font { font-family: 'Orbitron', sans-serif; }
        .terminal-box {
            background: rgba(10, 14, 28, 0.95);
            border: 1px solid rgba(236, 72, 153, 0.3);
            box-shadow: 0 0 50px rgba(168, 85, 247, 0.15);
            max-width: 480px;
            width: 100%;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            height: 85vh;
            max-height: 700px;
            overflow: hidden;
        }
        .glow-btn {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #f43f5e 100%);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
        }
    </style>
</head>
<body class="text-white">

    <div class="terminal-box">
        <!-- Terminal Top Bar -->
        <div class="flex items-center justify-between px-4 py-3 bg-slate-950/80 border-b border-slate-800/80">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
                <span class="text-xs font-mono text-slate-400 ml-2 tracking-wider">OMEGA://TERMINAL</span>
            </div>
            <div id="coinBadge" class="text-[11px] font-mono bg-slate-900 border border-slate-700 px-2.5 py-1 rounded-lg text-pink-300">
                10/10 FREE
            </div>
        </div>

        <!-- Chat Messages Area -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm">
            <!-- Initial Bot Message -->
            <div class="flex flex-col items-start space-y-1">
                <div class="max-w-[85%] bg-slate-900/90 border border-slate-800 p-3.5 rounded-2xl rounded-tl-sm text-slate-200 leading-relaxed shadow-sm">
                    <p class="font-bold text-pink-400 mb-1 text-xs">OMEGA. 🚀</p>
                    Hello! I am your AI OS.<br>తెలుగు లేదా English లో ఏదైనా అడగండి.
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-3 bg-slate-950/90 border-t border-slate-800/80 flex items-center gap-2">
            <input type="text" id="userInput" placeholder="మీ ప్రశ్న ఇక్కడ టైప్ చేయండి..." class="flex-1 bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-pink-500 text-sm" onkeypress="if(event.key === 'Enter') sendToOpenRouter()">
            <button onclick="sendToOpenRouter()" class="glow-btn text-white font-bold px-5 py-3 rounded-xl text-xs tracking-wider transition cursor-pointer">SEND</button>
        </div>
    </div>

    <script>
        const openRouterApiKey = "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";

        window.onload = function() {
            if(!localStorage.getItem('omega_coins')) {
                localStorage.setItem('omega_coins', '10');
            }
            updateCoinDisplay();
        }

        function updateCoinDisplay() {
            let coins = localStorage.getItem('omega_coins');
            document.getElementById('coinBadge').innerText = `${coins}/10 FREE`;
        }

        async function sendToOpenRouter() {
            const inputField = document.getElementById('userInput');
            const prompt = inputField.value.trim();
            if(!prompt) return;

            let coins = parseInt(localStorage.getItem('omega_coins') || '10');
            if(coins <= 0) {
                alert("ఫ్రీ లిమిట్ ముగిసింది అన్నా!");
                return;
            }

            const chatContainer = document.getElementById('chatContainer');

            // Append User Message
            chatContainer.innerHTML += `
                <div class="flex justify-end">
                    <div class="max-w-[85%] bg-gradient-to-r from-purple-600 to-pink-600 p-3.5 rounded-2xl rounded-tr-sm text-white shadow-md text-sm">
                        ${prompt}
                    </div>
                </div>
            `;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Append Loading Bubble
            const loadingId = 'load_' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex flex-col items-start space-y-1">
                    <div class="max-w-[85%] bg-slate-900 border border-slate-800 p-3.5 rounded-2xl rounded-tl-sm text-pink-400 text-xs flex items-center gap-2">
                        <div class="w-3 h-3 border-2 border-pink-400 border-t-transparent rounded-full animate-spin"></div>
                         సర్వర్ నుండి రెస్పాన్స్ వస్తోంది...
                    </div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${openRouterApiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "google/gemini-2.5-flash", 
                        "messages": [
                            {"role": "system", "content": "You are a helpful AI assistant. Always respond in Telugu unless asked otherwise."},
                            {"role": "user", "content": prompt}
                        ]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.error) {
                    throw new Error(data.error.message || "API Error");
                }

                const aiText = data.choices && data.choices[0].message && data.choices[0].message.content 
                    ? data.choices[0].message.content 
                    : "సమాచారం అందుబాటులో లేదు.";

                // Append AI Response
                chatContainer.innerHTML += `
                    <div class="flex flex-col items-start space-y-1">
                        <div class="max-w-[88%] bg-slate-900/95 border border-slate-800 p-3.5 rounded-2xl rounded-tl-sm text-slate-200 leading-relaxed text-sm shadow-sm whitespace-pre-wrap">
                            ${aiText}
                        </div>
                    </div>
                `;

                coins -= 1;
                localStorage.setItem('omega_coins', coins.toString());
                updateCoinDisplay();

            } catch (err) {
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `
                    <div class="flex flex-col items-start space-y-1">
                        <div class="max-w-[85%] bg-red-950/80 border border-red-800 p-3.5 rounded-2xl rounded-tl-sm text-red-300 text-xs">
                            ⚠️ కనెక్షన్ లోపం: ${err.message}
                        </div>
                    </div>
                `;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
