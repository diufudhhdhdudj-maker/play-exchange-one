<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Game</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: Arial, sans-serif; text-align: center; padding-top: 50px; }
        .wheel { width: 200px; height: 200px; border: 10px solid #38bdf8; border-radius: 50%; margin: 20px auto; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; background: #1e293b; transition: 3s; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <h1>🎲 Roulette Game 🎲</h1>
    <div class="wheel" id="wheelBox">SPIN</div>
    <br>
    <button onclick="spinWheel()">Spin Wheel</button>
    <p id="result" style="margin-top: 20px; font-size: 18px; color: #4ade80;"></p>

    <script>
        function spinWheel() {
            const box = document.getElementById('wheelBox');
            const result = document.getElementById('result');
            const randomDegree = Math.floor(Math.random() * 3600) + 360;
            box.style.transform = `rotate(${randomDegree}deg)`;
            result.innerText = "Spinning...";
            setTimeout(() => {
                const randomNumber = Math.floor(Math.random() * 37);
                result.innerText = `Winning Number: ${randomNumber}`;
            }, 3000);
        }
    </script>
</body>
</html>
